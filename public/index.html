<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CalBridge — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <img src="/images/calbridge-logo.png" alt="Calbridge" />
      <p>Client Portal</p>
    </div>
    <div id="auth-error" class="error-banner hidden"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
    </form>
    <p class="auth-switch" style="margin-top:12px;">
      <a href="/reset-password.html?forgot=1" style="font-size:13px;">Forgot password?</a>
    </p>
    <p class="auth-switch">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
