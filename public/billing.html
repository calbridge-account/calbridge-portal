<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calbridge — Billing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.375rem; font-weight: 700; color: #111827; margin-bottom: 0.5rem; }
    p  { font-size: 0.9375rem; color: #6b7280; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.625rem 1.5rem;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary   { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .badge-success  { background: #d1fae5; color: #065f46; }
    .badge-warning  { background: #fef3c7; color: #92400e; }
    .badge-error    { background: #fee2e2; color: #991b1b; }
    .badge-info     { background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Content injected by JS -->
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var status = params.get('status') || 'success';
      var card = document.getElementById('card');

      var STATES = {
        success: {
          icon:    '🎉',
          badge:   'badge-success',
          badgeText: 'Payment confirmed',
          title:   "You're all set!",
          message: "Your plan has been upgraded. Head to the dashboard to start using your new features.",
          cta:     { href: '/analytics/', label: 'Go to Dashboard →', cls: 'btn-primary' },
          cta2:    null,
        },
        pending: {
          icon:    '⏳',
          badge:   'badge-warning',
          badgeText: 'Payment pending',
          title:   "We're processing your payment",
          message: "Your subscription is being activated. This usually takes just a moment. Refresh the page or check back shortly.",
          cta:     { href: '/analytics/', label: 'Go to Dashboard →', cls: 'btn-primary' },
          cta2:    null,
        },
        cancelled: {
          icon:    '↩️',
          badge:   'badge-info',
          badgeText: 'No changes made',
          title:   "Checkout cancelled",
          message: "No worries — nothing was charged. You can upgrade your plan any time from your account settings.",
          cta:     { href: '/analytics/', label: 'Back to Dashboard', cls: 'btn-secondary' },
          cta2:    { href: '/analytics/pricing', label: 'View Plans', cls: 'btn-primary' },
        },
        error: {
          icon:    '❌',
          badge:   'badge-error',
          badgeText: 'Something went wrong',
          title:   "We hit a snag",
          message: "There was an issue processing your subscription. Please try again or contact support at support@teamcalbridge.com.",
          cta:     { href: '/analytics/pricing', label: 'Try Again', cls: 'btn-primary' },
          cta2:    { href: '/analytics/', label: 'Back to Dashboard', cls: 'btn-secondary' },
        },
        not_configured: {
          icon:    '🔧',
          badge:   'badge-warning',
          badgeText: 'Coming soon',
          title:   "Billing not yet configured",
          message: "Stripe billing isn't set up yet. Reach out to us at support@teamcalbridge.com to get access.",
          cta:     { href: '/analytics/', label: 'Back to Dashboard', cls: 'btn-secondary' },
          cta2:    null,
        },
      };

      var state = STATES[status] || STATES.success;

      var cta2Html = state.cta2
        ? '<a href="' + state.cta2.href + '" class="btn ' + state.cta2.cls + '">' + state.cta2.label + '</a>'
        : '';

      card.innerHTML =
        '<div class="icon">' + state.icon + '</div>' +
        '<span class="badge ' + state.badge + '">' + state.badgeText + '</span>' +
        '<h1>' + state.title + '</h1>' +
        '<p>' + state.message + '</p>' +
        '<div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">' +
          '<a href="' + state.cta.href + '" class="btn ' + state.cta.cls + '">' + state.cta.label + '</a>' +
          cta2Html +
        '</div>';
    })();
  </script>
</body>
</html>
