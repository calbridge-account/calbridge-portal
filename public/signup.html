<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calbridge — Sign Up</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <img src="/images/calbridge-logo.png" alt="Calbridge" />
      <p>Create your account</p>
    </div>
    <div id="auth-error" class="error-banner hidden"></div>
    <form id="signup-form">
      <div class="form-group">
        <label for="name">Company / Name</label>
        <input type="text" id="name" placeholder="Acme Brands LLC" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="8" />
      </div>
      <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/">Sign in</a></p>
  </div>
  <script src="/js/auth.js?v=3698dad"></script>
</body>
</html>
